<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ares'in Gün Batımı Macerası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--peach:#FFB38A;--gold:#FF9E5E;--cream:#FFD8B8;--coral:#F7A399;--lav:#C9A7D9;--navy:#1F2A55;--yellow:#FFD54F;--ink:#3B2A2A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#C9A7D9,#F7A399 55%,#FFB38A);font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:relative;width:min(100vw,480px);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;box-shadow:0 0 70px rgba(31,42,85,.35)}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:18px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dim{background:rgba(31,42,85,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.center{justify-content:flex-start}
.center>*:first-child{margin-top:auto}
.center>*:last-child{margin-bottom:auto}
@media (max-height:720px){.hubtitle .b{font-size:30px}.hubtitle .a{font-size:13px}.note{margin-top:8px;padding-top:10px;background-image:repeating-linear-gradient(180deg,transparent 0 29px,#e9d9c8 29px 30px)}.note h3{font-size:26px;margin-bottom:2px}.item{min-height:46px;padding:2px 0}.item .em{font-size:24px}.item .tx b{font-size:15.5px}.item .tx small{font-size:11.5px}.roses{margin-top:6px;font-size:12.5px}.plrow{margin-top:8px}.plrow .btn.big.playlist{font-size:19px;padding:9px 6px}.hubfoot{margin-top:8px}.hubfoot .btn{padding:9px 8px}.card{padding:14px 14px}.card .e{font-size:48px}.card h2{font-size:24px}}
.btn{border:none;font-weight:600;font-size:17px;padding:12px 16px;border-radius:16px;background:var(--navy);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.big{font-size:26px;font-weight:700;padding:13px 40px;background:linear-gradient(180deg,#FFB38A,#FF8A4C);color:#fff;text-shadow:0 2px 0 rgba(150,60,20,.4);box-shadow:0 6px 0 #c9602d,0 10px 24px rgba(255,120,60,.4)}
.btn.big:active{box-shadow:0 2px 0 #c9602d}
.btn.alt{background:#fff;color:var(--navy)}
/* hub = yaz defteri */
#hub{padding-top:14px}
.hubtitle{color:#fff;text-align:center;text-shadow:0 3px 0 #1F2A55}
.hubtitle .a{font-size:15px;font-weight:600;letter-spacing:3px;opacity:.95}
.hubtitle .b{font-size:38px;font-weight:700;line-height:1.05}
.note{position:relative;width:100%;margin-top:12px;background:#FFFBF4;border-radius:10px 22px 22px 10px;padding:14px 14px 10px 46px;box-shadow:0 10px 30px rgba(31,42,85,.3);background-image:repeating-linear-gradient(180deg,transparent 0 33px,#e9d9c8 33px 34px)}
.note:before{content:'';position:absolute;left:30px;top:0;bottom:0;width:2px;background:#F7A399}
.note .holes{position:absolute;left:9px;top:18px;bottom:18px;display:flex;flex-direction:column;justify-content:space-around}
.note .holes i{width:12px;height:12px;border-radius:50%;background:#C9A7D9;box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
.note h3{font-family:'Caveat',cursive;font-size:30px;color:#c9602d;line-height:1;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 0;cursor:pointer;border-radius:12px}
.item:active{background:rgba(255,179,138,.25)}
.item .bx{width:26px;height:26px;border:2.5px solid var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#2c8a4b;flex:none}
.item .em{font-size:28px;width:34px;text-align:center;flex:none}
.item .tx{flex:1;line-height:1.15}
.item .tx b{font-size:17px;color:var(--navy);display:block}
.item .tx small{font-size:12.5px;color:#7a5a50}
.item .st{font-size:15px;letter-spacing:-1px;flex:none}
.hubfoot{display:flex;gap:8px;width:100%;margin-top:12px}
.hubfoot .btn{flex:1;font-size:15px}
.btn.big.playlist{display:block;width:100%;text-align:center;text-decoration:none;margin-top:12px;font-size:20px;padding:12px 10px;background:linear-gradient(180deg,#2fd06a,#1DB954);box-shadow:0 6px 0 #148a3e,0 10px 24px rgba(29,185,84,.35)}
.btn.big.playlist:active{box-shadow:0 2px 0 #148a3e}
.plrow{display:flex;gap:10px;width:100%;margin-top:12px}
.plrow .btn.big.playlist{flex:1;margin-top:0;font-size:22px;padding:12px 6px}
.roses{color:#fff;font-weight:600;text-align:center;margin-top:10px;font-size:14px;text-shadow:0 2px 0 rgba(31,42,85,.5)}
/* intro / sonuç kartı */
.card{width:100%;max-width:380px;border-radius:26px;background:linear-gradient(165deg,#FFF3E8,#FFD8B8 45%,#FFB38A);border:4px solid #fff;padding:20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card .e{font-size:62px;line-height:1.1}
.card h2{font-size:28px;color:var(--navy);margin-top:4px}
.card .loves{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.card .loves span{background:var(--navy);color:var(--yellow);font-weight:600;font-size:13px;padding:4px 10px;border-radius:10px}
.card p{font-size:15px;line-height:1.45;margin-top:6px}
.card .how{background:rgba(255,255,255,.7);border-radius:14px;padding:10px;margin-top:10px;font-size:15px;line-height:1.4}
.card .how b{color:#c9602d}
.card .btns{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.card .row{display:flex;gap:8px}.card .row .btn{flex:1}
.stars{font-size:44px;letter-spacing:4px;margin:4px 0}
.stars i{font-style:normal;opacity:.25;filter:grayscale(1)}
.stars i.on{opacity:1;filter:none}
.score{font-size:18px;font-weight:600;color:var(--navy)}
.fact{background:#1F2A55;color:#FFE7D3;border-radius:16px;padding:12px;margin-top:12px;font-size:14px;line-height:1.45;text-align:left}
.fact b{color:var(--yellow)}
#pauseBtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:none;background:rgba(31,42,85,.55);color:#fff;font-size:16px;font-weight:700;cursor:pointer;z-index:5}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#C9A7D9,#F7A399 55%,#FFB38A);color:#fff;font-size:26px;font-weight:700;text-shadow:0 3px 0 #1F2A55;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#rotate small{font-size:15px;font-weight:600}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){#rotate{display:flex}}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(255,248,240,.97);color:var(--navy);font-weight:700;padding:9px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(31,42,85,.3);z-index:30;white-space:nowrap;font-size:15px;transition:opacity .3s,transform .3s;opacity:0;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(6px)}
.ending{color:#fff;text-align:center;justify-content:space-between;padding-top:11vh}
.ending .love{font-size:clamp(30px,10vw,44px);font-weight:700;line-height:1.1;text-shadow:0 4px 0 #1F2A55,0 10px 30px rgba(31,42,85,.4);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.ending h1{font-size:36px;text-shadow:0 4px 0 #1F2A55}
.ending .msg{background:rgba(255,248,240,.96);color:var(--ink);border-radius:22px;padding:20px;margin:16px 0;font-size:18px;line-height:1.5}
.ending .from{display:block;margin-top:10px;font-weight:700;color:#c9602d}
</style>
</head>
<body>
<div id="nojs" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(180deg,#C9A7D9,#F7A399 55%,#FFB38A);color:#1F2A55;font-family:system-ui,-apple-system,sans-serif">
  <div style="font-size:64px">🐶🤠</div>
  <div style="font-size:26px;font-weight:800;margin:10px 0">Oyun bu önizlemede çalışmıyor</div>
  <div style="font-size:17px;line-height:1.5;max-width:340px">WhatsApp / Dosyalar önizlemesi oyunu çalıştıramaz.<br><b>Bağlantıya dokunup Safari'de</b> (ya da Chrome'da) aç. 🧡</div>
</div>
<script>document.getElementById('nojs').remove()</script>
<div id="app">
  <canvas id="c"></canvas>
  <button id="pauseBtn" class="hidden" aria-label="Duraklat">II</button>

  <div id="hub" class="screen">
    <div class="hubtitle"><div class="a">ARES'İN</div><div class="b">GÜN BATIMI MACERASI</div></div>
    <div class="note"><div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
      <h3>Bugün ne yapacağız? ✏️</h3>
      <div id="list"></div>
    </div>
    <div class="roses" id="roseInfo"></div>
    <div class="plrow"><a class="btn big playlist pl" id="plBtn" href="https://open.spotify.com/playlist/1FVK9IGtvruaksbIRrosBj?si=1bada8012c854111" target="_blank" rel="noopener">🎵 23.59</a><a class="btn big playlist pl" id="plBtn2" href="https://open.spotify.com/playlist/5qE8Ow0TXxzwaE27f8NxMh?si=a17436bedfdf49dc" target="_blank" rel="noopener">🎵 01.25</a></div>
    <div class="hubfoot"><button class="btn alt" id="muteBtn">🔊 Ses</button><button class="btn alt" id="musicBtn">🎼 Oyun müziği</button><button class="btn alt" id="finalBtn">🏆 Final</button></div>
  </div>

  <div id="intro" class="screen dim center hidden"><div class="card" id="introCard"></div></div>
  <div id="result" class="screen dim center hidden"><div class="card" id="resultCard"></div></div>
  <div id="pause" class="screen dim center hidden">
    <div class="card"><div class="e">⏸️</div><h2>Durakladı</h2>
      <div class="btns"><button class="btn big" id="resumeBtn">DEVAM</button><div class="row"><button class="btn alt" id="pRestart">↻ Baştan</button><button class="btn alt" id="pHub">📒 Liste</button></div><div class="row"><button class="btn alt" id="pMute">🔊 Ses</button><button class="btn alt" id="pMusic">🎼 Müzik</button></div></div></div>
  </div>
  <div id="ending" class="screen ending hidden">
    <div class="love">Seni seviyorummmmm</div>
    <button class="btn big" id="endClose">🧡</button>
  </div>
  <div id="toast"></div>
  <div id="rotate"><div style="font-size:64px">📱</div><div>Telefonu dik tut</div><small>Ares dikey ekranda oynamayı seviyor 🐶</small></div>
</div>
<script>
'use strict';
/* ============ yardımcılar ============ */
const W=420;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const FONT="'Fredoka',system-ui,sans-serif";
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'}

/* ============ kayıt ============ */
const KEY='ares_macera_v2';
let S={stars:{},best:{},roses:[],muted:false,musicOff:false,endingSeen:false};
(function(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&typeof d==='object'){S.stars=d.stars||{};S.best=d.best||{};S.roses=Array.isArray(d.roses)?d.roses:[];S.muted=!!d.muted;S.musicOff=!!d.musicOff;S.endingSeen=!!d.endingSeen}}}catch(e){}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ ses ============ */
let AC=null,master=null;
function initAudio(){
  if(AC){if(AC.state==='suspended'&&state!=='pause')AC.resume().catch(()=>{});return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.muted?0:.6;master.connect(AC.destination)}catch(e){AC=null}
}
function setMuted(m){S.muted=m;save();if(master)master.gain.value=m?0:.6;const t=(m?'🔇':'🔊')+' Ses';$('muteBtn').textContent=t;$('pMute').textContent=t}
function setMusic(off){S.musicOff=off;save();$('musicBtn').textContent=off?'🎼 Müzik ✕':'🎼 Müzik ✓';$('pMusic').textContent=off?'🎼 Müzik kapalı':'🎼 Müzik açık'}
function tone(f,d,type,v,f2,delay){
  if(!AC||S.muted)return;
  try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}catch(e){}
}
let noiseBuf=null;
function noise(d,v,ff,delay,q){
  if(!AC||S.muted)return;
  try{if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=ff||1000;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}catch(e){}
}
/* elektro gitar tınısı (orijinal): iki testere dalga + alçak geçiren filtre + hafif bend */
function guitar(f,d,v,when){
  if(!AC||S.muted)return;
  try{const t=when!==undefined?when:AC.currentTime;const g=AC.createGain();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(900,t+d);lp.Q.value=4;
    [0,7].forEach(det=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f*Math.pow(2,-0.9/12),t);o.frequency.exponentialRampToValueAtTime(f,t+.08);o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+d+.05)});
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime((v||.12)*.5,t+d*.4);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    lp.connect(g);g.connect(master);
    const dl=AC.createDelay();dl.delayTime.value=.32;const fb=AC.createGain();fb.gain.value=.28;g.connect(dl);dl.connect(fb);fb.connect(dl);const wet=AC.createGain();wet.gain.value=.35;dl.connect(wet);wet.connect(master);
    setTimeout(()=>{try{fb.disconnect();wet.disconnect()}catch(e){}},(d+2.5)*1000);
  }catch(e){}
}
const SFX={
  coin(n){tone(880*Math.pow(2,((n||0)%7)/12),.09,'triangle',.11)},
  pick(){tone(620,.12,'sine',.15,980)},
  good(){tone(660,.09,'triangle',.13);tone(990,.16,'triangle',.13,null,.07)},
  great(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.11,null,i*.07))},
  bad(){tone(220,.25,'sawtooth',.09,140)},
  hit(){noise(.25,.3,380);tone(170,.25,'sawtooth',.1,70)},
  whoosh(){noise(.3,.18,1800,0,.6)},
  jump(){tone(380,.12,'square',.07,620)},
  click(){tone(760,.05,'triangle',.08)},
  boom(){noise(.8,.4,260);tone(110,.6,'sawtooth',.13,35)},
  bell(){tone(1568,.5,'sine',.15);tone(2093,.4,'sine',.08,null,.02)},
  crowd(){for(let i=0;i<5;i++)noise(.35,.12,700+i*150,i*.08,.5)},
  thump(){tone(70,.18,'sine',.35,40);noise(.08,.2,200)},
  rose(){[784,988,1175,1568].forEach((f,i)=>tone(f,.3,'sine',.12,null,i*.07))},
};
/* basit arka plan müziği (bölüme göre ton) */
let mStep=0;
const PAT=[0,2,4,2,1,3,4,3,0,2,4,5,3,2,1,4];
function musicTick(){
  if(!AC||S.muted||S.musicOff||document.hidden)return;
  if(state!=='play'&&state!=='hub')return;
  const m=(state==='play'&&scene&&scene.music)||{root:57,scale:[0,2,4,7,9],vol:.035};
  if(m.off)return;
  const i=PAT[mStep%16];const n=m.root+12+m.scale[i%5]+(i>=5?12:0);
  if(mStep%2===0)tone(440*Math.pow(2,(n-69)/12),.45,m.wave||'triangle',m.vol||.035);
  if(mStep%8===0)tone(440*Math.pow(2,(m.root-12-69)/12),1.6,'sine',(m.vol||.035)*1.5);
  if(m.drum&&mStep%4===0){tone(90,.12,'sine',.18,50);if(mStep%8===4)noise(.08,.12,2500)}
  mStep++;
}
setInterval(musicTick,170);

/* ============ tuval ============ */
const cv=$('c'),ctx=cv.getContext('2d');
let scale=1,H=740,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));scale=r.width/W;H=r.height/scale}
window.addEventListener('resize',resize);resize();

/* ============ parçacık & yazı ============ */
let P=[],FL=[];
function burst(x,y,c,n,sp,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(40,sp||240);P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.9),max:.9,c:Array.isArray(c)?c[i%c.length]:c,s:rnd(2,5),g:g===undefined?150:g,sq:false})}}
function confettiBurst(x,y,cols,n){for(let i=0;i<n;i++){const a=-Math.PI/2+rnd(-1.2,1.2),s=rnd(200,520);P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(1.2,2.2),max:2.2,c:cols[i%cols.length],s:rnd(3,6),g:420,sq:true,r:Math.random()*6})}}
function updP(dt){for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;if(p.sq){p.vx*=.99;p.r+=dt*8}}P=P.filter(p=>p.life>0);if(P.length>700)P.splice(0,P.length-700);for(const f of FL){f.y-=f.vy*dt;f.life-=dt}FL=FL.filter(f=>f.life>0)}
function drawP(c){for(const p of P){c.globalAlpha=clamp(p.life/p.max*1.5,0,1);c.fillStyle=p.c;if(p.sq){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillRect(-p.s,-p.s/2,p.s*2,p.s);c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill()}}c.globalAlpha=1;
  for(const f of FL){c.globalAlpha=clamp(f.life*1.5,0,1);txt(c,f.t,f.x,f.y,f.sz,f.c);}c.globalAlpha=1}
function float(x,y,t,c,sz,life){FL.push({x:x,y:y,t:t,c:c||'#fff',sz:sz||22,life:life||1.1,vy:40})}
function txt(c,s,x,y,size,color,align,stroke,weight){
  c.font=(weight||700)+' '+size+'px '+FONT+','+EMO;c.textAlign=align||'center';
  {const al=align||'center';const max=al==='center'?W-24:al==='left'?W-x-10:x-10;const mw=c.measureText(s).width;if(mw>max&&max>20){size=Math.max(9,size*max/mw);c.font=(weight||700)+' '+size+'px '+FONT+','+EMO}}
  if(stroke!==false){c.lineJoin='round';c.lineWidth=Math.max(3,size/6);c.strokeStyle=typeof stroke==='string'?stroke:'rgba(31,42,85,.65)';c.strokeText(s,x,y)}
  c.fillStyle=color||'#fff';c.fillText(s,x,y);
}
function emoji(c,e,x,y,size){c.font=size+'px '+EMO;c.textAlign='center';c.textBaseline='middle';c.fillText(e,x,y);c.textBaseline='alphabetic'}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function bar(c,x,y,w,h,f,col,bg){c.fillStyle=bg||'rgba(31,42,85,.5)';rrect(c,x,y,w,h,h/2);c.fill();if(f>0){c.fillStyle=col;rrect(c,x,y,Math.max(h,w*clamp(f,0,1)),h,h/2);c.fill()}}
function grad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}
function star5(c,x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function fbStar(c,x,y,R,t){const p=1+Math.sin((t||0)*6+x)*.08;c.fillStyle='#FFD54F';c.strokeStyle='#1F2A55';c.lineWidth=2.2;star5(c,x,y,R*p,R*.45*p);c.fill();c.stroke()}

/* ============ ÇİZİMLER ============ */
function drawHat(c,x,y,s,col,band){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle=col||'#B9692F';
  c.beginPath();c.moveTo(-16,2);c.quadraticCurveTo(-19,-5,-12,-3);c.lineTo(12,-3);c.quadraticCurveTo(19,-5,16,2);c.quadraticCurveTo(0,6,-16,2);c.fill();
  c.beginPath();c.moveTo(-8,-2);c.lineTo(-7,-12);c.quadraticCurveTo(-4,-15,0,-11);c.quadraticCurveTo(4,-15,7,-12);c.lineTo(8,-2);c.closePath();c.fill();
  c.fillStyle=band||'#FFD54F';c.fillRect(-8,-5,16,2.6);
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(-3,-9,2,4,0,0,7);c.fill();
  c.restore();
}
function fluff(c,cx,cy,rx,ry,n,br){c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,7);c.fill();for(let i=0;i<n;i++){const a=i/n*Math.PI*2;c.beginPath();c.arc(cx+Math.cos(a)*rx*.92,cy+Math.sin(a)*ry*.92,br,0,7);c.fill()}}

/* Ares — yandan (sağa bakar), ayaklar y=0'da */
function drawAresSide(c,x,y,s,o){
  o=o||{};const t=o.t||0;const run=o.run?Math.sin(t*20):0;
  c.save();c.translate(x,y);c.scale(s*(o.flip?-1:1),s);
  if(o.shadow!==false){c.fillStyle='rgba(0,0,0,.16)';c.beginPath();c.ellipse(0,1,22,4,0,0,7);c.fill()}
  // kuyruk
  c.fillStyle='#F3ECE5';fluff(c,-23,-30+run*1.5,6,6,6,3);
  // bacaklar
  c.fillStyle='#EDE5DD';
  const L=[[-14,run],[-6,-run],[10,-run],[18,run]];
  for(const l of L){c.beginPath();c.ellipse(l[0]+l[1]*3,-6+Math.abs(l[1])*-2,4.2,7,0,0,7);c.fill()}
  // gövde
  c.fillStyle='#FFFFFF';fluff(c,0,-20,22,13,10,4);
  if(o.jersey){c.save();c.beginPath();c.ellipse(2,-21,19,12,0,0,7);c.clip();c.fillStyle='#FFD54F';c.fillRect(-25,-40,50,40);c.fillStyle='#1F2A55';for(let i=-24;i<26;i+=10)c.fillRect(i,-40,5,40);c.restore()}
  // kafa
  c.fillStyle='#FFFFFF';fluff(c,20,-36,12,11.5,9,3.4);
  // kulak
  c.fillStyle='#EFE7DF';c.save();c.translate(13,-32);c.rotate(.25+(o.run?Math.sin(t*20)*.15:0));c.beginPath();c.ellipse(0,4,6,11,0,0,7);c.fill();c.restore();
  // göz, burun, dil
  const blink=(Math.floor(t*8)%37===0)?.25:1;
  c.fillStyle='#1c1410';c.beginPath();c.ellipse(24,-38,2.4,2.4*blink,0,0,7);c.fill();
  c.fillStyle='#fff';c.fillRect(24.4,-39.6,1,1);
  c.fillStyle='#1c1410';c.beginPath();c.ellipse(32.5,-33,2.8,2.3,0,0,7);c.fill();
  if(o.happy!==false){c.fillStyle='#ff8fa0';c.beginPath();c.ellipse(29,-27,2,2.8,.3,0,7);c.fill()}
  if(o.hat!==false)drawHat(c,20,-47,1.25,o.hatCol||'#B9692F',o.band||'#FFD54F');
  if(o.hats){for(let i=0;i<o.hats.length;i++)drawHat(c,20+i*.5,-55-i*8,1.1-i*.06,o.hats[i][0],o.hats[i][1])}
  c.restore();
}
/* Ares — önden/arkadan şirin (chibi), ayaklar y=0 */
function drawAresFront(c,x,y,s,o){
  o=o||{};const t=o.t||0;const run=o.run?Math.sin(t*18):0;
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,1,17,5,0,0,7);c.fill();
  c.fillStyle='#EDE5DD';c.beginPath();c.ellipse(-7,-5-run*3,5,7,0,0,7);c.fill();c.beginPath();c.ellipse(7,-5+run*3,5,7,0,0,7);c.fill();
  c.fillStyle='#fff';fluff(c,0,-18,15,12,9,3.5);
  if(o.jersey){c.save();c.beginPath();c.ellipse(0,-18,14,11,0,0,7);c.clip();c.fillStyle='#FFD54F';c.fillRect(-16,-32,32,30);c.fillStyle='#1F2A55';for(let i=-14;i<16;i+=8)c.fillRect(i,-32,4,30);c.restore();
    if(o.num){c.font='700 9px '+FONT;c.textAlign='center';c.fillStyle='#fff';c.strokeStyle='#1F2A55';c.lineWidth=2;c.strokeText(o.num,0,-14);c.fillText(o.num,0,-14)}}
  if(o.back){ // arkadan: sadece kafa tüyü ve kulaklar
    c.fillStyle='#fff';fluff(c,0,-36,13,12,9,3.5);
    c.fillStyle='#EFE7DF';c.beginPath();c.ellipse(-12,-32,5,10,.2,0,7);c.fill();c.beginPath();c.ellipse(12,-32,5,10,-.2,0,7);c.fill();
  }else{
    c.fillStyle='#EFE7DF';c.beginPath();c.ellipse(-12,-32,5,10,.2,0,7);c.fill();c.beginPath();c.ellipse(12,-32,5,10,-.2,0,7);c.fill();
    c.fillStyle='#fff';fluff(c,0,-36,12.5,12,9,3.4);
    const blink=(Math.floor(t*8)%41===0)?.25:1;
    c.fillStyle='#1c1410';c.beginPath();c.ellipse(-4.6,-37,2.3,2.3*blink,0,0,7);c.fill();c.beginPath();c.ellipse(4.6,-37,2.3,2.3*blink,0,0,7);c.fill();
    c.fillStyle='#fff';c.fillRect(-4.4,-38.4,1,1);c.fillRect(4.8,-38.4,1,1);
    c.fillStyle='#1c1410';c.beginPath();c.ellipse(0,-32,2.6,2,0,0,7);c.fill();
    if(o.happy!==false){c.fillStyle='#ff8fa0';c.beginPath();c.ellipse(0,-28,1.8,2.4,0,0,7);c.fill()}
  }
  if(o.hat!==false)drawHat(c,0,-48,1.3,o.hatCol||'#B9692F',o.band||'#FFD54F');
  c.restore();
}
/* yalnızca yüz (pencerelerde) */
function drawAresFace(c,x,y,s,t){
  c.save();c.translate(x,y);c.scale(s,s);

  c.moveTo(0,44);c.quadraticCurveTo(-23,44,-22,24);c.quadraticCurveTo(-21,14,-14,10);c.quadraticCurveTo(-23,4,-19,-8);c.quadraticCurveTo(-12,-3,-6,4);
  c.lineTo(6,4);c.quadraticCurveTo(12,-3,19,-8);c.quadraticCurveTo(23,4,14,10);c.quadraticCurveTo(21,14,22,24);c.quadraticCurveTo(23,44,0,44);c.closePath();c.fill();
  // pickguard
  c.fillStyle='#f5f2ea';c.beginPath();c.moveTo(-4,8);c.lineTo(12,8);c.quadraticCurveTo(17,16,13,30);c.lineTo(4,36);c.lineTo(-4,30);c.closePath();c.fill();
  // manyetikler & köprü
  c.fillStyle='#111';c.fillRect(-7,12,14,6);c.fillRect(-7,24,14,6);
  c.fillStyle='#ddd';c.fillRect(-7,33,14,2);c.fillRect(-5,38,10,1.6);

/* gün batımı turuncusu Targa (yandan, sağa bakar; zemin y=0) */
const CAR_COL={body:'#FF9E5E',light:'#FFC39A',dark:'#C9602D'};
function carPart(c,k,o){
  o=o||{};
  if(k==='chassis'){
    const g=c.createLinearGradient(0,-50,0,-14);g.addColorStop(0,CAR_COL.light);g.addColorStop(1,CAR_COL.body);c.fillStyle=g;
    c.beginPath();c.moveTo(-96,-14);c.lineTo(-100,-32);c.quadraticCurveTo(-100,-48,-84,-49);c.lineTo(58,-47);c.quadraticCurveTo(94,-46,101,-32);c.lineTo(101,-22);c.quadraticCurveTo(100,-14,92,-14);c.closePath();c.fill();
    c.fillStyle='#2a2030';for(const wx of [-60,64]){c.beginPath();c.arc(wx,-14,20,Math.PI,0);c.fill()}
    c.strokeStyle=CAR_COL.dark;c.lineWidth=1.2;c.beginPath();c.moveTo(-36,-44);c.lineTo(-38,-18);c.moveTo(34,-44);c.lineTo(36,-18);c.stroke();
    c.fillStyle='#d9d9d9';c.fillRect(20,-38,8,2);
    c.fillStyle='#1d1d1d';c.fillRect(-101,-24,10,6);c.fillRect(92,-24,9,6);
  }else if(k==='engine'){
    c.fillStyle='#8b8f99';c.fillRect(-92,-44,30,14);c.fillStyle='#5f6470';for(let i=0;i<6;i++)c.fillRect(-90+i*5,-44,2.5,14);
    if(o.blue){c.strokeStyle='#bfe3ff';c.lineWidth=1;c.strokeRect(-92,-44,30,14)}
  }else if(k==='wheels'){
    for(const wx of [-60,64]){c.save();c.translate(wx,-14);c.fillStyle='#1b1b1f';c.beginPath();c.arc(0,0,16,0,7);c.fill();c.fillStyle='#cfd3da';c.beginPath();c.arc(0,0,10,0,7);c.fill();
      c.rotate(o.rot||0);c.strokeStyle='#8a8f99';c.lineWidth=3;for(let i=0;i<5;i++){c.rotate(Math.PI*2/5);c.beginPath();c.moveTo(0,0);c.lineTo(0,-9);c.stroke()}
      c.fillStyle='#FF9E5E';c.beginPath();c.arc(0,0,2.6,0,7);c.fill();c.restore()}
  }else if(k==='cabin'){
    const g=c.createLinearGradient(0,-80,0,-46);g.addColorStop(0,CAR_COL.light);g.addColorStop(1,CAR_COL.body);c.fillStyle=g;
    c.beginPath();c.moveTo(-88,-48);c.quadraticCurveTo(-62,-50,-38,-68);c.quadraticCurveTo(-22,-79,0,-78);c.quadraticCurveTo(14,-77,28,-60);c.lineTo(46,-47);c.closePath();c.fill();
    c.fillStyle='#bfe0f2';
    c.beginPath();c.moveTo(-54,-52);c.quadraticCurveTo(-40,-64,-24,-71);c.lineTo(-18,-72);c.lineTo(-18,-52);c.closePath();c.fill();
    c.beginPath();c.moveTo(-4,-73);c.quadraticCurveTo(10,-72,22,-58);c.lineTo(32,-51);c.lineTo(-4,-51);c.closePath();c.fill();
    if(o.ares){drawAresFace(c,8,-58-(o.roof||0)*12,1.05,o.t||0)}
    // tavan paneli (Targa) — açılınca kayıyor
    const rp=o.roof||0;
    if(rp<1){c.save();c.globalAlpha=1-rp;c.fillStyle=CAR_COL.body;c.beginPath();c.moveTo(-6-rp*30,-79);c.quadraticCurveTo(10-rp*30,-78.5,20-rp*30,-70);c.lineTo(-6-rp*30,-72);c.closePath();c.fill();c.restore()}
  }else if(k==='targa'){
    c.fillStyle='#c9ced6';c.beginPath();c.moveTo(-22,-48);c.lineTo(-20,-76);c.quadraticCurveTo(-12,-80,-4,-79);c.lineTo(-6,-48);c.closePath();c.fill();
    c.fillStyle='#e9ecf0';c.fillRect(-18,-74,3,24);
  }else if(k==='lights'){
    c.fillStyle=CAR_COL.light;c.beginPath();c.ellipse(84,-44,12,6,-.15,Math.PI,0);c.fill();
    c.fillStyle='#FFF6D8';c.beginPath();c.ellipse(88,-42,5.5,6.5,0,0,7);c.fill();c.strokeStyle='#d9d9d9';c.lineWidth=1.4;c.stroke();
    if(o.glow){const g=c.createRadialGradient(92,-42,2,92,-42,40);g.addColorStop(0,'rgba(255,246,216,.6)');g.addColorStop(1,'rgba(255,246,216,0)');c.fillStyle=g;c.beginPath();c.arc(100,-40,40,0,7);c.fill()}
    c.fillStyle='#e8413b';c.fillRect(-101,-42,16,4);c.fillStyle='#ff8a80';c.fillRect(-99,-41,8,1.6);
  }
}
const CAR_ORDER=['chassis','engine','wheels','cabin','targa','lights'];
function drawCar(c,x,y,s,o){
  o=o||{};c.save();c.translate(x,y);c.scale(s,s);

function ghostCar(c,x,y,s){

  c.beginPath();c.moveTo(-96,-14);c.lineTo(-100,-32);c.quadraticCurveTo(-100,-48,-84,-49);c.lineTo(58,-47);c.quadraticCurveTo(94,-46,101,-32);c.lineTo(101,-22);c.quadraticCurveTo(100,-14,92,-14);c.closePath();c.stroke();
  c.beginPath();c.moveTo(-88,-48);c.quadraticCurveTo(-62,-50,-38,-68);c.quadraticCurveTo(-22,-79,0,-78);c.quadraticCurveTo(14,-77,28,-60);c.lineTo(46,-47);c.stroke();

  const bg=c.createLinearGradient(-17,0,17,0);bg.addColorStop(0,'#FFB38A');bg.addColorStop(.45,'#FFE7D3');bg.addColorStop(1,'#FFB38A');c.fillStyle=bg;path();c.fill();
  c.save();path();c.clip();c.fillStyle='#FF8A4C';c.fillRect(-20,-60,40,24);c.fillStyle='#FFD54F';c.fillRect(-20,14,40,5);c.fillStyle='#1F2A55';c.fillRect(-20,19,40,5);c.fillStyle='rgba(255,255,255,.25)';c.fillRect(-12,-60,5,95);c.restore();
  c.strokeStyle='rgba(31,42,85,.35)';c.lineWidth=1.5;path();c.stroke();
  c.fillStyle='#5b5470';c.beginPath();c.moveTo(-10,30);c.lineTo(10,30);c.lineTo(12,36);c.lineTo(-12,36);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(0,-14,13.5,0,7);c.fill();
  c.save();c.beginPath();c.arc(0,-14,11.5,0,7);c.clip();c.fillStyle='#cfe8ff';c.fillRect(-14,-28,28,28);drawAresFace(c,0,-11,.95,t);c.restore();
  c.strokeStyle='#FFD54F';c.lineWidth=2.5;c.beginPath();c.arc(0,-14,12.5,0,7);c.stroke();
  c.restore();
}

/* uzay iniş aracı (yandan, sağa bakar) */

class Football{
  constructor(){
    this.id='futbol';this.t=0;this.music={root:55,scale:[0,2,4,7,9],vol:.028,drum:true};
    this.attack=0;this.goals=0;this.stars=0;this.beaten=0;this.x=W*.3;this.tx=this.x;this.scroll=0;this.ents=[];
    this.dribble=0;this.cool=0;this.boost=0;this.msg='';this.msgT=0;this.ballRot=0;this.keys={l:0,r:0};
    this.nextAttack();
  }
  say(m,t){this.msg=m;this.msgT=t||2}
  nextAttack(){
    if(this.attack>=3){
      const st=this.goals;
      finishChapter(this.goals*1000+this.stars*10+this.beaten*50,st,[
        '⚽ Gol: <b>'+this.goals+'/3</b>','⭐ Yıldız: <b>'+this.stars+'</b>','🌀 Marcelo çalımıyla geçilen: <b>'+this.beaten+'</b>']);
      this.over=true;return;
    }
    this.attack++;this.phase='run';this.pt=0;this.ents=[];this.x=this.tx=W*.3;this.spawnD=-120;this.starD=60;this.padD=-350;this.dist=0;
    this.say('Atak '+this.attack+'/3 · Sol kanattan çık!',2.2);
  }
  update(dt){
    if(this.over)return;
    this.t+=dt;this.pt+=dt;if(this.msgT>0)this.msgT-=dt;if(this.cool>0)this.cool-=dt;if(this.dribble>0)this.dribble-=dt;if(this.boost>0)this.boost-=dt;
    if(this.phase==='run')this.updRun(dt);
    else if(this.phase==='shot')this.updShot(dt);
    else if(this.phase==='lost'){if(this.pt>1.7)this.nextAttack()}
    else if(this.phase==='goal'||this.phase==='saved'){if(this.pt>2.4)this.nextAttack()}
  }
  updRun(dt){
    const sp=250*(this.boost>0?1.6:1);const d=sp*dt;this.scroll+=d;this.dist+=d;this.ballRot+=dt*12;
    if(this.keys.l)this.tx-=420*dt;if(this.keys.r)this.tx+=420*dt;
    this.tx=clamp(this.tx,54,W-30);this.x+=(this.tx-this.x)*Math.min(1,dt*11);
    const py=H*.74;
    this.spawnD+=d;const gap=[0,300,250,210][this.attack];
    if(this.spawnD>gap){this.spawnD=rnd(-60,0);const near=Math.random()<.55;this.ents.push({type:'def',x:near?clamp(this.x+rnd(-60,60),54,W-30):rnd(54,W-30),y:-40,ph:Math.random()*6})}
    this.starD+=d;if(this.starD>280){this.starD=rnd(-40,40);const x0=rnd(70,W-50);const curve=Math.random()<.5;for(let i=0;i<5;i++)this.ents.push({type:'star',x:clamp(x0+(curve?Math.sin(i*.8)*40:0),60,W-30),y:-20-i*34})}
    this.padD+=d;if(this.padD>820){this.padD=rnd(-200,0);this.ents.push({type:'pad',x:rnd(80,W-60),y:-40})}
    for(const e of this.ents){
      if(e.dead)continue;e.y+=d;
      if(e.type==='def'){const chase=40+this.attack*22;e.x+=clamp(this.x-e.x,-1,1)*chase*dt;e.y+=55*dt;e.ph+=dt}
      if(e.y>H+60){e.dead=true;continue}
      const dx=e.x-this.x,dy=e.y-py;const dd=Math.hypot(dx,dy);
      if(e.type==='star'&&dd<30){e.dead=true;this.stars++;SFX.coin(this.stars);burst(e.x,e.y,'#FFD54F',5,140)}
      else if(e.type==='pad'&&Math.abs(dx)<36&&Math.abs(dy)<26&&!e.used){e.used=true;this.boost=1.8;SFX.whoosh();this.say('⚡ Ferdi hızı! Sol kanattan fırladın!',1.6);burst(this.x,py,'#9ff5c3',14)}
      else if(e.type==='def'&&!e.beaten&&dd<27){
        if(this.dribble>0){e.beaten=true;this.beaten++;this.stars+=2;float(this.x,py-70,'ÇALIM! +2⭐','#fff',22);SFX.good()}
        else{this.phase='lost';this.pt=0;SFX.hit();this.say('Top kaptırıldı! Bir sonraki atak...',1.7);burst(this.x,py-10,'#fff',12);return}
      }
    }
    this.ents=this.ents.filter(e=>!e.dead);
    if(this.pt>11){this.phase='shot';this.pt=0;this.ents=[];this.shot=null;this.say('Kaleye geldin! Doğru anda dokun: ŞUT!',2.2)}
  }
  updShot(dt){

function drawHubBg(c){
  const t=hubT;sunsetSky(c);sunDisc(c,W*.62,H*.85,34);

let endHearts=[];
function drawEnding(c,dt){
  sunsetSky(c);sunDisc(c,W/2,H*.86,40);skyline(c,H*.9,'rgba(122,74,104,.5)',1);c.fillStyle=grad(c,H*.9,H,['#E8C9A0','#d9a87a']);c.fillRect(0,H*.9,W,H*.1);

  for(const h of endHearts){h.y-=h.v*dt;h.p+=dt*2;c.globalAlpha=.85;emoji(c,'🧡',h.x+Math.sin(h.p)*12,h.y,h.s)}c.globalAlpha=1;endHearts=endHearts.filter(h=>h.y>-40);
  const k=clamp(endT/0.8,0,1);const bounce=k>=1?Math.abs(Math.sin(endT*3))*14:0;

}

let last=performance.now();let hubT=0;
function frame(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,.05);
  const c=ctx;c.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  if(state==='play'&&scene){scene.update(dt);updP(dt);roseUpdate(dt)}
  else if(state==='result'||state==='ending'){updP(dt)}
  if(state==='ending'){endT+=dt;drawEnding(c,dt)}
  else if(scene&&(state==='play'||state==='pause'||state==='result'||state==='intro')){scene.draw(c);if(!scene.ownP)drawP(c);roseDraw(c)}
  else{hubT+=dt;drawHubBg(c);drawP(c)}
  requestAnimationFrame(frame);
}
